{% extends 'base.html' %}

{% block content %}

<div class="container py-5" style="max-width: 500px;">

    <h3 class="text-center">Set New Password</h3>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-success w-100 mt-3">Change Password</button>

    </form>

</div>

{% endblock %}
