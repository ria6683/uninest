{% extends 'base.html' %}

{% block content %}

<div class="container py-5" style="max-width:400px;">

    <h2>Login</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-primary w-100">Login</button>

    </form>

    <div class="mt-3 text-center">

        <a href="{% url 'password_reset' %}" class="text-muted small">Forgot Password?</a>

    </div>

</div>

{% endblock %}
